services:
  - type: web
    name: ajobi-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: https://ajobi-recent.onrender.com
      - key: NEXT_PUBLIC_EMAILJS_SERVICE_ID
        value: service_ko4lzf7
      - key: NEXT_PUBLIC_EMAILJS_TEMPLATE_ID
        value: template_gew60no
      - key: NEXT_PUBLIC_EMAILJS_PUBLIC_KEY
        value: LMTU2WKnCpbkSjDfD
